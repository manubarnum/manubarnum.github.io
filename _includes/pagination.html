<!-- Pagination Links Start -->

<nav class="pt-5">
  <ul class="pagination justify-content-center">
    {% if paginator.previous_page %}
    <li class="page-item">
      <a href="{{ paginator.previous_page_path | relative_url }}" aria-label="Précédent">
        <span aria-hidden="true">&laquo; Articles plus récents</span>
      </a>
    </li>
    {% endif %} {% if paginator.previous_page and paginator.next_page %}
    <li class="page-item disabled">
      <span>|</span>
    </li>
    {% endif %} {% if paginator.next_page %}
    <li class="page-item">
      <a href="{{ paginator.next_page_path | relative_url }}" aria-label="Suivant">
        <span aria-hidden="true">Articles plus anciens &raquo;</span>
      </a>
    </li>
    {% endif %}
  </ul>
</nav>

<!-- Pagination Links End -->
