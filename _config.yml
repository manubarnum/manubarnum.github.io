# Site settings

# NB! Set your site's url, otherwise nothing will work
url: "https://manubarnum.github.io"
baseurl: ""

# Google tracking id
google-tracking-id: "UA-316171-11"

#############
# HTML Head #
#############

lang: "fr"
author: "Emmanuel Enkirche"
title: "{ Emmanuel Enkirche }"
description: "Blog et website de Emmanuel Enkirche. Quelques notes sur mon parcours professionnel en générale, mon évolution personnelle en particulier. Les opinions exprimées sont les miennes."
keywords: "enkirche, emmanuel, logisticien, formateur, CV"
favicon: "/img/point-favicon.ico"

################
# Header layout#
################
black-favicon: "/img/point-favicon.ico"
background-img: "../img/fonddecran.jpg"

##############################
# Dynamic Text on the Header #
##############################

quote: "Bienvenue sur mon CV en ligne ! Quelques notes sur mon parcours professionnel."
me-img: "/img/portrait.png"

# To use github profile pic uncomment the following line and replace 'user_name'
# with your github user name.

# me-img: "https://github.com/user_name.png?size=500"

# To use gravatar profile pic uncomment the following line and replace 'email_hash'
# with your gravatar profile email hash.
# You can create the email hash by using an online tool like 'http://www.md5hashgenerator.com/'
# just enter your email and it will generate the hash.

# me-img: "https://www.gravatar.com/avatar/email_hash?s=500"

#######
# Blog #
########

post-preview-words: 96
paginate: 12
email-share: True
fb-share: True
linkedin-share: True
reddit-share: True
x-share: True
hackernews-share: True
tumblr-share: True
pinterest-share: True
pocket-share: True
vkontakte-share: True

# NB! Create an account in Cusdis and update the app id, otherwise the comments won't work
cusdis-app-id: "d34a3968-9be5-46d7-98f1-c4263cd1a220"

